<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>最深之剑 - 汉化版</title>
	<style>
		html,
		body {
			background: #050709;
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
			color: #d8d9dd;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		#gameStage {
			position: relative;
			width: 100%;
			height: calc(100vh - 116px);
			min-height: 280px;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
		}

		#loadStatus {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			color: #aeb4bd;
			font-size: 14px;
		}

		#loadStatus[hidden] {
			display: none;
		}

		#localizationNotice {
			box-sizing: border-box;
			height: 116px;
			padding: 12px 20px;
			border-top: 1px solid #30343a;
			background: #101317;
			text-align: center;
			font-size: 14px;
			line-height: 1.6;
		}

		#localizationNotice strong {
			color: #ffffff;
			font-weight: 600;
		}

		#localizationNotice a {
			color: #79c7b5;
			text-decoration: none;
		}

		#localizationNotice a:hover {
			text-decoration: underline;
		}

		@media (max-width: 640px) {
			#gameStage { height: calc(100vh - 148px); }
			#localizationNotice { height: 148px; padding: 9px 12px; font-size: 12px; }
		}
	</style>
</head>

<body>
	<div id="gameStage">
		<div id="loadStatus">正在加载汉化版……</div>
		<div id="gameContainer">
			<canvas id="unity-canvas"></canvas>
		</div>
	</div>
	<footer id="localizationNotice">
		<div><strong>锅巴汉化 × 人民汉化</strong> · 用爱发电 · 永不收费</div>
		<div>本汉化仅供个人学习、研究与非商业体验，禁止转载、二次分发、打包发布及商业使用</div>
		<div>原作权利归原作者及相应权利人所有；本汉化按现状提供，使用风险由使用者自行承担</div>
		<div>更多放置类汉化游戏：<a href="https://gityx.com" target="_blank" rel="noopener noreferrer">gityx.com</a></div>
	</footer>
	<script src="Build/fflate.min.js"></script>
	<script src="Build/WebBuilds.loader.js"></script>
	<script>
		async function decompressGzip(url, mimeType) {
			var response = await fetch(url);
			if (!response.ok) {
				throw new Error("资源下载失败：" + url);
			}
			var compressed = new Uint8Array(await response.arrayBuffer());
			var decompressed = fflate.gunzipSync(compressed);
			return URL.createObjectURL(new Blob([decompressed], { type: mimeType }));
		}

		async function boot() {
			var status = document.querySelector("#loadStatus");
			var urls = await Promise.all([
				decompressGzip("Build/WebBuilds.data.gz", "application/octet-stream"),
				decompressGzip("Build/WebBuilds.framework.js.gz", "text/javascript"),
				decompressGzip("Build/WebBuilds.wasm.gz", "application/wasm")
			]);
			var instance = await createUnityInstance(document.querySelector("#unity-canvas"), {
				dataUrl: urls[0],
				frameworkUrl: urls[1],
				codeUrl: urls[2],
				streamingAssetsUrl: "StreamingAssets",
				companyName: "Cosmic Adventure Squad",
				productName: "最深之剑",
				productVersion: "0.1.5c",
			});
			status.hidden = true;
			urls.forEach(URL.revokeObjectURL);
				var canvas = instance.Module.canvas;
				var container = canvas.parentElement;
				var stage = document.querySelector("#gameStage");
				function onResize() {
					var w;
					var h;

					if (scaleToFit) {
						w = stage.clientWidth;
						h = stage.clientHeight;

						var r = 540 / 960;

						if (w * r > stage.clientHeight) {
							w = Math.min(w, Math.ceil(h / r));
						}
						h = Math.floor(w * r);
					} else {
						w = 960;
						h = 540;
					}

					container.style.width = canvas.style.width = w + "px";
					container.style.height = canvas.style.height = h + "px";
					container.style.top = Math.floor((stage.clientHeight - h) / 2) + "px";
					container.style.left = Math.floor((stage.clientWidth - w) / 2) + "px";
				}

				var scaleToFit;
				try {
					scaleToFit = !!JSON.parse("");
				} catch (e) {
					scaleToFit = true;
				}
				window.addEventListener('resize', onResize);
				onResize();
		}

		boot().catch(function (error) {
			document.querySelector("#loadStatus").textContent = "加载失败：" + error.message;
			console.error(error);
		});
	</script>
</body>

</html>
