<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>最深之剑 - 汉化版</title>
	<style>
		html,
		body {
			background: #050709;
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
			color: #d8d9dd;
			font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
		}

		#gameStage {
			position: relative;
			width: 100%;
			height: calc(100vh - 116px);
			min-height: 280px;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
		}

		div#gameContainer canvas {
			position: absolute;
		}

		#loadStatus {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			color: #aeb4bd;
			font-size: 14px;
		}

		#loadStatus[hidden] {
			display: none;
		}

		.load-progress {
			width: min(360px, calc(100vw - 48px));
		}

		.load-title {
			margin-bottom: 12px;
			color: #f2f3f5;
			font-size: 16px;
			text-align: center;
		}

		.load-track {
			height: 8px;
			overflow: hidden;
			border: 1px solid #41464e;
			background: #171b20;
		}

		.load-fill {
			width: 0;
			height: 100%;
			background: #79c7b5;
			transition: width 120ms linear;
		}

		.load-meta {
			display: flex;
			justify-content: space-between;
			margin-top: 8px;
			font-size: 12px;
			font-variant-numeric: tabular-nums;
		}

		#localizationNotice {
			box-sizing: border-box;
			height: 116px;
			padding: 12px 20px;
			border-top: 1px solid #30343a;
			background: #101317;
			text-align: center;
			font-size: 14px;
			line-height: 1.6;
		}

		#localizationNotice strong {
			color: #ffffff;
			font-weight: 600;
		}

		#localizationNotice a {
			color: #79c7b5;
			text-decoration: none;
		}

		#localizationNotice a:hover {
			text-decoration: underline;
		}

		@media (max-width: 640px) {
			#gameStage { height: calc(100vh - 148px); }
			#localizationNotice { height: 148px; padding: 9px 12px; font-size: 12px; }
		}
	</style>
</head>

<body>
	<div id="gameStage">
		<div id="loadStatus" role="status" aria-live="polite">
			<div class="load-progress">
				<div class="load-title">正在加载汉化版</div>
				<div id="loadTrack" class="load-track" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
					<div id="loadFill" class="load-fill"></div>
				</div>
				<div class="load-meta"><span id="loadPhase">准备资源</span><span id="loadPercent">0%</span></div>
			</div>
		</div>
		<div id="gameContainer">
			<canvas id="unity-canvas"></canvas>
		</div>
	</div>
	<footer id="localizationNotice">
		<div><strong>锅巴汉化 × 人民汉化</strong> · 用爱发电 · 永不收费</div>
		<div>本汉化仅供个人学习、研究与非商业体验，禁止转载、二次分发、打包发布及商业使用</div>
		<div>原作权利归原作者及相应权利人所有；本汉化按现状提供，使用风险由使用者自行承担</div>
		<div>更多放置类汉化游戏：<a href="https://gityx.com" target="_blank" rel="noopener noreferrer">gityx.com</a></div>
	</footer>
	<script src="Build/fflate.min.js"></script>
	<script src="Build/WebBuilds.loader.js"></script>
	<script>
		var assets = [
			{ url: "Build/WebBuilds.data.gz", mime: "application/octet-stream", size: 4598760 },
			{ url: "Build/WebBuilds.framework.js.gz", mime: "text/javascript", size: 87661 },
			{ url: "Build/WebBuilds.wasm.gz", mime: "application/wasm", size: 4882774 }
		];
		var totalDownloadBytes = assets.reduce(function (total, asset) { return total + asset.size; }, 0);
		var downloadedBytes = assets.map(function () { return 0; });

		function setProgress(value, phase) {
			var percent = Math.max(0, Math.min(100, Math.round(value)));
			document.querySelector("#loadFill").style.width = percent + "%";
			document.querySelector("#loadTrack").setAttribute("aria-valuenow", String(percent));
			document.querySelector("#loadPercent").textContent = percent + "%";
			document.querySelector("#loadPhase").textContent = phase;
		}

		function updateDownloadProgress() {
			var loaded = downloadedBytes.reduce(function (total, value) { return total + value; }, 0);
			setProgress(70 * loaded / totalDownloadBytes, "正在下载资源");
		}

		async function downloadGzip(asset, index) {
			var response = await fetch(asset.url);
			if (!response.ok) {
				throw new Error("资源下载失败：" + asset.url);
			}
			if (!response.body) {
				var fallback = new Uint8Array(await response.arrayBuffer());
				downloadedBytes[index] = asset.size;
				updateDownloadProgress();
				return fallback;
			}
			var reader = response.body.getReader();
			var chunks = [];
			var length = 0;
			while (true) {
				var result = await reader.read();
				if (result.done) break;
				chunks.push(result.value);
				length += result.value.length;
				downloadedBytes[index] = Math.min(length, asset.size);
				updateDownloadProgress();
			}
			var compressed = new Uint8Array(length);
			var offset = 0;
			chunks.forEach(function (chunk) {
				compressed.set(chunk, offset);
				offset += chunk.length;
			});
			downloadedBytes[index] = asset.size;
			updateDownloadProgress();
			return compressed;
		}

		async function boot() {
			var status = document.querySelector("#loadStatus");
			setProgress(0, "正在下载资源");
			var compressedAssets = await Promise.all(assets.map(downloadGzip));
			var urls = compressedAssets.map(function (compressed, index) {
				setProgress(70 + (index + 1) / assets.length * 10, "正在解压资源");
				var decompressed = fflate.gunzipSync(compressed);
				return URL.createObjectURL(new Blob([decompressed], { type: assets[index].mime }));
			});
			var instance = await createUnityInstance(document.querySelector("#unity-canvas"), {
				dataUrl: urls[0],
				frameworkUrl: urls[1],
				codeUrl: urls[2],
				streamingAssetsUrl: "StreamingAssets",
				companyName: "Cosmic Adventure Squad",
				productName: "最深之剑",
				productVersion: "0.1.5c",
			}, function (progress) {
				setProgress(80 + progress * 20, "正在启动游戏");
			});
			setProgress(100, "加载完成");
			status.hidden = true;
			urls.forEach(URL.revokeObjectURL);
				var canvas = instance.Module.canvas;
				var container = canvas.parentElement;
				var stage = document.querySelector("#gameStage");
				function onResize() {
					var w;
					var h;

					if (scaleToFit) {
						w = stage.clientWidth;
						h = stage.clientHeight;

						var r = 540 / 960;

						if (w * r > stage.clientHeight) {
							w = Math.min(w, Math.ceil(h / r));
						}
						h = Math.floor(w * r);
					} else {
						w = 960;
						h = 540;
					}

					container.style.width = canvas.style.width = w + "px";
					container.style.height = canvas.style.height = h + "px";
					container.style.top = Math.floor((stage.clientHeight - h) / 2) + "px";
					container.style.left = Math.floor((stage.clientWidth - w) / 2) + "px";
				}

				var scaleToFit;
				try {
					scaleToFit = !!JSON.parse("");
				} catch (e) {
					scaleToFit = true;
				}
				window.addEventListener('resize', onResize);
				onResize();
		}

		boot().catch(function (error) {
			document.querySelector(".load-title").textContent = "加载失败";
			document.querySelector("#loadPhase").textContent = error.message;
			console.error(error);
		});
	</script>
</body>

</html>
